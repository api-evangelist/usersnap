aid: usersnap
name: Usersnap
description: >-
  Usersnap is a user feedback platform from Perg/Linz, Austria that lets
  product, development, customer success, and marketing teams capture,
  organize, and act on user feedback with embeddable widgets for screenshots,
  screen recordings, ratings, and surveys. Beyond the widgets, Usersnap ships
  a plan-gated platform REST API (JWT bearer auth) for submitting and
  querying feedback, HMAC-signed webhooks, an official npm browser package,
  and a hosted MCP server (mcp.usersnap.com) secured with OAuth 2.1 + PKCE so
  AI assistants can query feedback and create opportunities.
